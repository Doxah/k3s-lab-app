apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/doxah/guestbook-api    # le tag est géré par kustomization.yaml
          ports:
            - containerPort: 8000
          env:
            - name: DB_HOST
              value: postgres                       # résolu par CoreDNS
            - name: DB_NAME
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: POSTGRES_DB}}
            - name: DB_USER
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: POSTGRES_USER}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: POSTGRES_PASSWORD}}
          livenessProbe:                            # échec répété = redémarrage du conteneur
            httpGet: {path: /api/healthz, port: 8000}
            periodSeconds: 10
          readinessProbe:                           # échec = retiré du Service, pas redémarré
            httpGet: {path: /api/readyz, port: 8000}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 8000