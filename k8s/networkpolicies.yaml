apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}               # tous les pods du namespace
  policyTypes: [Ingress]        # aucune règle « ingress » : tout l'entrant est refusé
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-web
spec:
  podSelector:
    matchExpressions:
      - {key: app, operator: In, values: [api, frontend]}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:    # même élément de liste que podSelector : ET logique
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:                    # ports des conteneurs, pas des Services
        - port: 8000
        - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-to-postgres
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api
      ports:
        - port: 5432