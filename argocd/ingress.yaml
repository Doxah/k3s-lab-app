apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure   # port 443 seulement
    traefik.ingress.kubernetes.io/router.tls: "true"             # certificat par défaut de Traefik
spec:
  ingressClassName: traefik
  rules:
    - host: argocd.k3s.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: argocd-server, port: {number: 80}}