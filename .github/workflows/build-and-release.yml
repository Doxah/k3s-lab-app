name: build-and-release

on:
  push:
    branches: [main]
    paths: ["api/**", "frontend/**", ".github/workflows/**"]   # pas k8s/** : évite les boucles

permissions:
  contents: read                     # par défaut, le moins de droits possible

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: pip install ruff && ruff check api/

  build:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write                # pousser sur GHCR avec le GITHUB_TOKEN
    strategy:
      matrix:
        component: [api, frontend]   # deux jobs en parallèle
    steps:
      - uses: actions/checkout@v7
      - name: Nom et tag de l'image
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/guestbook-${{ matrix.component }}" >> "$GITHUB_ENV"
          echo "TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.component }}
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          build-args: APP_VERSION=${{ env.TAG }}

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write                # pousser le commit qui change le tag
    steps:
      - uses: actions/checkout@v7
      - name: Mettre à jour le tag dans k8s/kustomization.yaml
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          sed -i "s/newTag: .*/newTag: \"${TAG}\"/" k8s/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: guestbook ${TAG}"
          git push
